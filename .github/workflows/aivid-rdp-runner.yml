name: AIVID RDP runner ZIP
on:
  pull_request:
    paths:
      - 'scripts/aivid-rdp/**'
      - '.github/workflows/aivid-rdp-runner.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local dependencies and test
        shell: pwsh
        working-directory: scripts/aivid-rdp
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build no-admin Windows ZIP
        shell: pwsh
        run: |
          $source = 'scripts/aivid-rdp'
          $target = Join-Path $env:RUNNER_TEMP 'aivid-rdp-runner'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach ($name in @('runner.mjs','preflight.mjs','README.md','trial.example.json','run-preflight.cmd','run-submit.cmd')) {
            Copy-Item (Join-Path $source $name) (Join-Path $target $name)
          }
          Copy-Item (Join-Path $source 'node_modules') (Join-Path $target 'node_modules') -Recurse
          Copy-Item (Get-Command node).Source (Join-Path $target 'node.exe')
          & (Join-Path $source 'build-windows.ps1') -Target $target
          Compress-Archive -Path $target -DestinationPath 'aivid-rdp-runner-windows-exe.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: aivid-rdp-runner-windows-exe
          path: aivid-rdp-runner-windows-exe.zip
          retention-days: 7
