name: AIVID RDP agent package
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/aivid-rdp/**'
      - 'src/aivid_rdp*'
      - 'src/provider/aivid.js'
      - 'src/provider/aivid_uploads.js'
      - 'src/aivid_probe_assets.js'
      - 'src/aivid_models.js'
      - 'src/aivid_runtime.js'
      - 'src/aivid_rdp_http.js'
      - 'src/provider/browserless.js'
      - '.github/workflows/aivid-rdp-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: cmm_rdp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/aivid_rdp_mysql.test.js
        env:
          RDP_MYSQL_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: cmm_rdp_ci
          ADMIN_TOKEN: ci-only-rdp-admin
          ACTIVITY_LOG: 'off'
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install portable dependencies and test real Chrome
        shell: pwsh
        working-directory: scripts/aivid-rdp
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build portable package
        shell: pwsh
        run: |
          $source='scripts/aivid-rdp'
          $target=Join-Path $env:RUNNER_TEMP 'aivid-rdp-agent'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach($name in @('agent.cjs','worker.cjs','native.cjs','login.cjs','README.md')) { Copy-Item (Join-Path $source $name) $target }
          Copy-Item (Join-Path $source 'node_modules') (Join-Path $target 'node_modules') -Recurse
          Copy-Item (Get-Command node).Source (Join-Path $target 'node.exe')
          New-Item -ItemType Directory -Path (Join-Path $target 'provider') -Force | Out-Null
          Copy-Item 'src/provider/aivid.js','src/provider/aivid_uploads.js','src/provider/browserless.js' (Join-Path $target 'provider')
          # The model registry is required by the standalone browser adapter.
          Copy-Item 'src/aivid_models.js' (Join-Path $target 'aivid_models.js')
          & (Join-Path $source 'build-windows.ps1') -Target $target
          Compress-Archive -Path $target -DestinationPath 'aivid-rdp-agent-windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: aivid-rdp-agent-windows
          path: aivid-rdp-agent-windows.zip
          retention-days: 30
