name: Node tests
on:
  push:
    branches:
      - feature/888api-integration
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check src/api888_models.js
          node --check src/provider/api888.js
          node --check src/api888_queue.js
          node --check src/settings.js
          node --check src/provider_models.js
          node --check server.js
          node --check worker.js
      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee node-test-output.log
          exit ${PIPESTATUS[0]}
      - name: Upload Node test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: node-test-output.log
          if-no-files-found: ignore
          retention-days: 7
