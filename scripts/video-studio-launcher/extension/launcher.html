<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>CMMTools Video Studio</title>
<link rel="stylesheet" href="launch-ui.css" />
</head>
<body class="compact">
<main class="launch-card">
  <img class="wordmark" src="brand/cmm-lockup.png" alt="CMMTools" />
  <div class="loader-scene" aria-hidden="true">
    <span class="halo halo-one"></span><span class="halo halo-two"></span>
    <span class="spinner"></span>
    <img class="glyph" src="brand/icon-128.png" alt="" />
  </div>
  <div class="eyebrow">VIDEO STUDIO</div>
  <h1 id="heading">Opening your workspace</h1>
  <p id="detail" role="status" aria-live="polite">Preparing your studio window…</p>
  <div class="progress" aria-hidden="true"><div class="progress-line"></div></div>
  <button id="retry" class="retry" type="button" hidden>Try again</button>
  <div class="footer"><span class="status-dot"></span> CMMTools launcher</div>
</main>
<script src="launcher.js"></script>
</body></html>
