<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Studio</title>
<style>
:root{color-scheme:dark;--bg:#0a0f15;--card:#121a24;--line:#26374a;--muted:#9db0c5;--accent:#e6a66d;--danger:#d96c77}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f5f9;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:26px;font-weight:850}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}input,textarea,select,button{width:100%;padding:12px 14px;border:1px solid #34495f;border-radius:11px;background:#0c131c;color:white;font:inherit}textarea{min-height:145px;resize:vertical}button{background:var(--accent);color:#1b120b;border:none;font-weight:800;cursor:pointer}.secondary{background:#25384e;color:white}.ghost{background:transparent;border:1px solid #3d526b;color:white}.danger{background:var(--danger);color:white}.hide{display:none!important}.auth{max-width:560px;margin:60px auto}.tabs{display:flex;gap:8px}.tabs button{background:#223247;color:#fff}.tabs button.active{background:var(--accent);color:#1b120b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.job{border:1px solid var(--line);background:#0d141d;border-radius:14px;padding:14px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#24364c;font-size:12px}.ok{color:#82d8a0}.err{color:#ff8f99}.credits{font-size:18px;font-weight:800}video{width:100%;border-radius:10px;margin-top:10px;background:#000}.poster{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#080c10}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="brand">AI Video Studio</div><div class="muted">Powered by our private generation backend</div></div><div id="accountBox" class="hide"><span class="credits"><span id="credits">0</span> credits</span> <button class="ghost" style="width:auto;margin-left:10px" onclick="logout()">Sign out</button></div></div>

<div id="authView" class="auth card">
  <div class="tabs"><button id="loginTab" class="active" onclick="showAuth('login')">Login</button><button id="registerTab" onclick="showAuth('register')">Create account</button></div>
  <h2 id="authTitle">Welcome back</h2>
  <label>Email</label><input id="email" type="email" autocomplete="email">
  <label style="display:block;margin-top:12px">Password</label><input id="password" type="password" autocomplete="current-password">
  <button style="margin-top:14px" onclick="submitAuth()">Continue</button>
  <p id="authMsg" class="muted"></p>
</div>

<div id="appView" class="hide">
  <div class="card">
    <h2>Create video</h2>
    <label>Prompt</label><textarea id="prompt" placeholder="Describe the scene, subject, action, camera movement, lighting..."></textarea>
    <div class="row" style="margin-top:12px">
      <div><label>Model</label><select id="model" onchange="renderDurations()"></select></div>
      <div><label>Duration</label><select id="duration" onchange="updateCost()"></select></div>
      <div><label>Aspect ratio</label><select id="ratio"></select></div>
    </div>
    <div style="margin-top:12px" class="muted">Cost: <strong id="cost">—</strong> credits</div>
    <button style="margin-top:14px" onclick="createGeneration()">Generate video</button>
    <p id="genMsg" class="muted"></p>
  </div>

  <div class="card"><div class="top"><h2>Your generations</h2><button class="secondary" style="width:auto" onclick="loadGenerations()">Refresh</button></div><div id="jobs" class="grid"></div></div>
</div>
</div>
<script>
let authMode='login', config=null, me=null, poll=null;
async function api(path,options={}){
  const headers=Object.assign({},options.headers||{});
  if(options.body && !headers['content-type']) headers['content-type']='application/json';
  const r=await fetch(path,Object.assign({credentials:'same-origin'},options,{headers}));
  const data=await r.json().catch(()=>({ok:false,error:'Invalid server response'}));
  if(!r.ok){const e=new Error(data.error||('HTTP '+r.status));e.status=r.status;throw e} return data;
}
function showAuth(mode){authMode=mode;document.getElementById('loginTab').classList.toggle('active',mode==='login');document.getElementById('registerTab').classList.toggle('active',mode==='register');document.getElementById('authTitle').textContent=mode==='login'?'Welcome back':'Create your account';document.getElementById('authMsg').textContent='';}
async function submitAuth(){const msg=document.getElementById('authMsg');msg.textContent='Working...';try{const body={email:email.value,password:password.value};const data=await api('/api/auth/'+authMode,{method:'POST',body:JSON.stringify(body)});me=data.user;showApp();}catch(e){msg.textContent=e.message;msg.className='err';}}
async function logout(){try{await api('/api/auth/logout',{method:'POST'});}catch{}location.reload();}
function showApp(){document.getElementById('authView').classList.add('hide');document.getElementById('appView').classList.remove('hide');document.getElementById('accountBox').classList.remove('hide');document.getElementById('credits').textContent=me.credits;renderConfig();loadGenerations();clearInterval(poll);poll=setInterval(loadGenerations,5000);}
function renderConfig(){if(!config)return;model.innerHTML=config.pricing.map(m=>'<option value="'+m.id+'">'+m.label+'</option>').join('');ratio.innerHTML=config.aspectRatios.map(r=>'<option>'+r+'</option>').join('');renderDurations();}
function renderDurations(){const m=config.pricing.find(x=>x.id===model.value)||config.pricing[0];duration.innerHTML=m.durations.map(d=>'<option value="'+d.seconds+'" data-cost="'+d.cost+'">'+d.seconds+'s</option>').join('');updateCost();}
function updateCost(){const opt=duration.options[duration.selectedIndex];document.getElementById('cost').textContent=opt?opt.dataset.cost:'—';}
async function createGeneration(){const msg=document.getElementById('genMsg');msg.textContent='Queueing...';try{const data=await api('/api/generations',{method:'POST',body:JSON.stringify({prompt:prompt.value,model:model.value,duration:Number(duration.value),aspectRatio:ratio.value})});me=data.user;document.getElementById('credits').textContent=me.credits;prompt.value='';msg.textContent='Generation queued.';await loadGenerations();}catch(e){msg.textContent=e.message;msg.className='err';}}
function jobCard(g){const media=g.has_video?'<video controls preload="metadata" src="'+g.video_url+'"></video>':(g.has_poster?'<img class="poster" src="'+g.poster_url+'">':'');return '<div class="job"><div class="top"><span class="badge">'+g.status+'</span><span class="muted">'+g.credits_cost+' cr</span></div><p><strong>'+escapeHtml(g.model)+'</strong> · '+g.duration+'s · '+g.aspect_ratio+'</p><p class="muted">'+escapeHtml(g.prompt.slice(0,180))+'</p>'+media+(g.error_message?'<p class="err">'+escapeHtml(g.error_message)+'</p>':'')+'</div>';}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function loadGenerations(){try{const data=await api('/api/generations');jobs.innerHTML=data.generations.length?data.generations.map(jobCard).join(''):'<p class="muted">No generations yet.</p>';const m=await api('/api/me');me=m.user;document.getElementById('credits').textContent=me.credits;}catch(e){if(e.status===401)location.reload();}}
async function boot(){try{config=await api('/api/config');if(!config.signupsEnabled)document.getElementById('registerTab').classList.add('hide');try{const m=await api('/api/me');me=m.user;showApp();}catch(e){if(e.status!==401)throw e;}}catch(e){document.getElementById('authMsg').textContent=e.message;}}
boot();
</script></body></html>
